@if (submitted){
  <div class="container">
    @if (isOkay) {
      <div class="activate-message">
        <h2>Activation Successful!</h2>
        <p>Your account has been successfully activated!</p>
        <button class="btn btn-primary" (click)="redirectToLogin()">Login</button>
      </div>
    } @else {
      {{ activationError }}
    }

    <ng-template #activationError>
      <div class="activate-error">
        <h2>Activation Failed!</h2>
        <p>{{ message }}</p>
        <button class="btn btn-primary" (click)="submitted = false">Try Again</button>
      </div>
    </ng-template>
  </div>
} @else {
  {{ codeForm }}
}

<ng-template #codeForm >
  <div class="container">
    <div class="text-center" style="width: 400px;">
      <h2>Type your activation code</h2>
      <code-input [isCodeHidden]="false" [codeLength]="6" [code]="'string'" (codeCompleted)="onCodeCompleted($event)">
      </code-input>
    </div>

  </div>
</ng-template>
