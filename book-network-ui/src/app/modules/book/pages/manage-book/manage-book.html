<div class="p-2">
  <h2>Manage my book</h2>
  <hr>
  @if(errorMsg.length) {
    <div class="alert alert-danger mt-2" role="alert">
      @for (msg of errorMsg; track msg) {
        <p class="p-0 m-0">{{ msg }}</p>
      }
    </div>
  }
  <div class="d-flex gap-2">
    <div class="col-3">
      <img class="rounded-1" width="100%" height="100%" [src]="selectedPicture || 'https://picsum.photos/1900/800'">
      <div class="mt-2">
        <input (change)="onFileSelected($event)" class="form-control" type="file" id="formFile" accept="image/*">
      </div>
    </div>
  </div>
</div>
